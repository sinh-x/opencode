repository: sinh-x/opencode
upstream_repository: anomalyco/opencode

branches:
  dev:
    role: upstream-tracking
    tracks: upstream/dev
    accepts:
      - upstream-sync
    rejects:
      - sinh-specific-work
      - pa-feature-work
      - merges-from-sinh-x-dev
    protection:
      require_pull_request: true
      require_status_checks: true
      allow_direct_pushes: false
      notes:
        - Direct personal pushes are prohibited.
        - Updates should only mirror upstream/dev through the documented sync path.

  sinh-x-dev:
    role: personal-integration
    base: dev
    accepts:
      - sinh-specific-work
      - pa-managed-customizations
      - upstream-sync-from-dev
    rejects:
      - upstream-pr-work
    protection:
      require_pull_request: true
      require_status_checks: true
      allow_admin_override: true
      required_checks:
        - typecheck
      notes:
        - This is the long-lived base for Sinh-specific OpenCode customizations.
        - Personal feature branches merge here, never into dev.
        - Keep the required gate lightweight; full unit/e2e workflows are optional or manual for high-risk changes.

feature_branches:
  sinh_specific:
    pattern: feat/*
    base: sinh-x-dev
    target: sinh-x-dev
    examples:
      - feat/branch-strategy
      - feat/side-panel-launch-vars
  upstream_sync:
    pattern: sync/upstream-*
    base: dev
    target: sinh-x-dev
    notes:
      - Use only when upstream changes need conflict resolution before reaching sinh-x-dev.
  release_sync:
    pattern: sync/release-*
    base: sinh-x-dev
    target: sinh-x-dev
    notes:
      - Immutable release-tag sync flow. Merges a verified upstream release tag (e.g. v1.18.19) directly into the release branch.
      - Never touches dev (FR8). The release branch is created from sinh-x-dev and targets sinh-x-dev.
      - Source identity is verified against an exact approved 40-character SHA before merge (NFR3).
      - Frozen install and typecheck gate every push (NFR6).
      - Distinct from upstream_sync (sync/upstream-*), which mirrors the moving upstream/dev ref through dev.

pull_requests:
  title_format: conventional_commit
  allowed_types:
    - feat
    - fix
    - docs
    - chore
    - refactor
    - test
  scope_guidance:
    - Use the affected package or area as scope when practical, for example app, desktop, opencode, or branch-strategy.
    - Do not prefix titles with ticket IDs; keep ticket IDs in the PR body, branch name, commit body, or ticket links.
  examples:
    - docs(opencode): set up fork branch strategy
    - feat(opencode): add side panel launch variables
    - chore(branch-strategy): sync upstream into sinh-x-dev

flows:
  upstream_sync:
    - upstream/dev
    - dev
    - sinh-x-dev
  release_sync:
    - upstream/tags/v1.18.19
    - sync/release-v1.18.19
    - sinh-x-dev
  personal_work:
    - sinh-x-dev
    - feat/*
    - sinh-x-dev

prohibited_flows:
  - from: sinh-x-dev
    to: dev
    reason: dev must remain an upstream-tracking branch only.
  - from: feat/*
    to: dev
    reason: Sinh-specific and PA feature work must target sinh-x-dev.
  - from: sinh-x-dev
    to: upstream/dev
    reason: Personal customizations are not submitted upstream by default.
  - from: sync/release-*
    to: dev
    reason: Release sync branches merge upstream tags directly into sinh-x-dev; they must never touch dev (FR8).

agent_rules:
  choose_base_branch:
    personal_customization: sinh-x-dev
    pa_managed_customization: sinh-x-dev
    branch_strategy_docs: sinh-x-dev
    upstream_mirror_update: dev
  before_editing:
    - Read AGENTS.md.
    - Read .opencode/skills/git-workflow/SKILL.md.
    - Verify the current branch matches the expected feature branch.
  never:
    - Do not create personal feature work from dev.
    - Do not merge sinh-x-dev into dev.
    - Do not target dev for Sinh-specific OpenCode customizations.
