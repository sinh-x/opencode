name: sync-upstream-smoke

on:
  push:
    branches: [dev]
    paths:
      - "script/sync-upstream.ts"
      - ".github/workflows/sync-upstream-smoke.yml"
  pull_request:
    branches: [dev, sinh-x-dev]
    paths:
      - "script/sync-upstream.ts"
      - ".github/workflows/sync-upstream-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    name: sync-upstream.ts smoke test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # CQ-1: ensure the 904-line sync script loads, parses, and exits 0 on --help.
      - name: --help exits 0
        run: bun run script/sync-upstream.ts --help

      # CQ-1 / SQ-1: ensure invalid --base-branch values are rejected before
      # they can flow into any shell command. The script must exit non-zero.
      - name: --base-branch rejects invalid input
        run: |
          set +e
          output=$(bun run script/sync-upstream.ts --base-branch "evil rm -rf /" 2>&1)
          code=$?
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: expected non-zero exit for invalid --base-branch"
            exit 1
          fi
          if ! echo "$output" | grep -q "not a valid branch name"; then
            echo "FAIL: expected rejection message, got the above"
            exit 1
          fi
          echo "OK: invalid --base-branch rejected with exit $code"

      # Release-mode smoke (Phase 2 — FR1, NFR3, NFR5):
      # --release-tag without --expected-source-sha must exit non-zero (FR1).
      - name: release mode rejects tag without SHA
        run: |
          set +e
          output=$(bun run script/sync-upstream.ts --release-tag v1.18.19 2>&1)
          code=$?
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: expected non-zero exit for --release-tag without --expected-source-sha"
            exit 1
          fi
          if ! echo "$output" | grep -q "requires both"; then
            echo "FAIL: expected 'requires both' rejection message"
            exit 1
          fi
          echo "OK: release tag without SHA rejected with exit $code"

      # --expected-source-sha without --release-tag must exit non-zero (FR1).
      - name: release mode rejects SHA without tag
        run: |
          set +e
          output=$(bun run script/sync-upstream.ts --expected-source-sha 2b72179c663cadcb54f54d9f19221b3fb3d11fb6 2>&1)
          code=$?
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: expected non-zero exit for --expected-source-sha without --release-tag"
            exit 1
          fi
          if ! echo "$output" | grep -q "requires both"; then
            echo "FAIL: expected 'requires both' rejection message"
            exit 1
          fi
          echo "OK: SHA without tag rejected with exit $code"

      # Malformed release tag must exit non-zero (FR1).
      - name: release mode rejects malformed tag
        run: |
          set +e
          output=$(bun run script/sync-upstream.ts --release-tag "not-a-tag" --expected-source-sha 2b72179c663cadcb54f54d9f19221b3fb3d11fb6 2>&1)
          code=$?
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: expected non-zero exit for malformed --release-tag"
            exit 1
          fi
          if ! echo "$output" | grep -q "not a valid release tag"; then
            echo "FAIL: expected 'not a valid release tag' rejection message"
            exit 1
          fi
          echo "OK: malformed release tag rejected with exit $code"

      # Abbreviated/wrong SHA must exit non-zero (NFR3 — no abbreviated SHA).
      - name: release mode rejects wrong-length SHA
        run: |
          set +e
          output=$(bun run script/sync-upstream.ts --release-tag v1.18.19 --expected-source-sha "abc123" 2>&1)
          code=$?
          echo "$output"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: expected non-zero exit for abbreviated --expected-source-sha"
            exit 1
          fi
          if ! echo "$output" | grep -q "not a valid 40-character"; then
            echo "FAIL: expected 'not a valid 40-character' rejection message"
            exit 1
          fi
          echo "OK: wrong-length SHA rejected with exit $code"